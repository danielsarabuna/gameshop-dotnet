name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build (Release)
        run: dotnet build WebShop.sln -c Release -m:1 -p:NuGetAudit=false
      # Postgres-интеграционные тесты используют Testcontainers — Docker есть на runner'е.
      - name: Unit tests
        run: dotnet test tests/Ordering.Domain.Tests/Ordering.Domain.Tests.csproj -c Release -p:NuGetAudit=false --no-build
      - name: Integration tests (InMemory + Testcontainers Postgres)
        run: dotnet test tests/WebShop.IntegrationTests/WebShop.IntegrationTests.csproj -c Release -p:NuGetAudit=false --no-build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApps/Shopping.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApps/Shopping.Web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build web apigateway catalog-api basket-api ordering-api
