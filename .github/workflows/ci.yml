name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore WebShop.sln
      - run: dotnet format WebShop.sln --verify-no-changes --no-restore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore WebShop.sln -p:NuGetAudit=true
      - run: dotnet build WebShop.sln -c Release --no-restore -m:1

  unit-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Domain tests with coverage
        run: dotnet test tests/Ordering.Domain.Tests/Ordering.Domain.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory TestResults/ordering
      - name: Catalog tests with coverage
        run: dotnet test tests/Catalog.API.Tests/Catalog.API.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory TestResults/catalog
      - name: API tests with coverage
        run: dotnet test tests/WebShop.IntegrationTests/WebShop.IntegrationTests.csproj -c Release --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory TestResults/api
      - name: Coverage no-regression gate
        run: bash scripts/check-coverage.sh TestResults 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml

  postgres-integration-tests:
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER_TESTS: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: docker info
      - run: dotnet test tests/WebShop.IntegrationTests/WebShop.IntegrationTests.csproj -c Release --filter "Category=Integration"
      - run: bash scripts/test-supabase-schema.sh

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApps/Shopping.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApps/Shopping.Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: src/WebApps/Shopping.Web/test-results

  docker-build:
    runs-on: ubuntu-latest
    env:
      SHOP_DOMAIN: localhost
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: ordering
      RABBITMQ_USER: webshop
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-password
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_ROLE_KEY: build-only
      CATALOG_CACHE_INVALIDATION_SECRET: build-only
      GAME_TICKET_JWT_PRIVATE_KEY_PEM_BASE64: build-only
      GAME_TICKET_JWT_PUBLIC_KEY_PEM_BASE64: build-only
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Catalog topology
        run: |
          docker compose -f docker-compose.prod.yml config --format json \
            | jq -e '. as $root
              | $root.services["catalog-api"] as $catalog
              | $catalog.environment.Kestrel__HttpPort == "8080"
                and $catalog.environment.Kestrel__GrpcPort == "8081"
                and ($catalog.environment.Supabase__Url | length > 0)
                and ($catalog.environment.Supabase__ServiceRoleKey | length > 0)
                and ($root.services | has("mongodb") | not)
                and (["catalog-api", "basket-api", "ordering-api"]
                  | all(. as $name
                    | $root.services[$name].healthcheck.test
                      == ["CMD", "curl", "-fsS", "http://localhost:8080/health"]))'
      - run: docker compose build web apigateway catalog-api basket-api ordering-api
      - name: Generate production smoke-test ticket keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/game-ticket-private.pem
          openssl pkey -in /tmp/game-ticket-private.pem -pubout -out /tmp/game-ticket-public.pem
          echo "GAME_TICKET_JWT_PRIVATE_KEY_PEM_BASE64=$(base64 -w0 /tmp/game-ticket-private.pem)" >> "$GITHUB_ENV"
          echo "GAME_TICKET_JWT_PUBLIC_KEY_PEM_BASE64=$(base64 -w0 /tmp/game-ticket-public.pem)" >> "$GITHUB_ENV"
      - name: Start production topology and smoke test Caddy to Gateway to Ordering
        run: |
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240
          curl --insecure --fail --show-error --silent --retry 20 --retry-all-errors \
            https://localhost/api/v1/payment-methods | jq -e 'type == "array"'
      - name: Show production logs after failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=200
      - name: Stop production topology
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApps/Shopping.Web/package-lock.json
      - run: dotnet restore WebShop.sln -p:NuGetAudit=true
      - run: dotnet list WebShop.sln package --vulnerable --include-transitive
      - run: npm ci
        working-directory: src/WebApps/Shopping.Web
      - run: npm audit --audit-level=high
        working-directory: src/WebApps/Shopping.Web
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
