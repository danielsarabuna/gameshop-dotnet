server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ensure WebAssembly is served with the right MIME type. nginx:alpine
    # defaults already include application/wasm in 1.21+, but spell it out
    # for safety against older base images.
    types {
        application/wasm wasm;
    }

    # SPA-style fallback: any unknown path serves index.html so client-side
    # routing in Blazor WASM (Pages/*.razor) works on hard reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the framework payload — it's content-hashed.
    location /_framework/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Don't log /health probes — keeps Docker healthcheck noise out of stdout.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;
    gzip_min_length 1024;
}
