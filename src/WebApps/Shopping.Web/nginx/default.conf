server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" always;

    # SPA-style fallback: any unknown path serves index.html so client-side
    # routing in Blazor WASM (Pages/*.razor) works on hard reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser uses same-origin /api calls; nginx forwards them to YARP.
    location /api/ {
        proxy_pass http://apigateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache the framework payload — it's content-hashed.
    location /_framework/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Don't log /health probes — keeps Docker healthcheck noise out of stdout.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;
    gzip_min_length 1024;
}
