  <path d="M250 15 C 230 -10, 180 10, 200 45 C 215 70, 250 95, 250 105 C 250 95, 285 70, 300 45 C 320 10, 270 -10, 250 15 Z" fill="none" stroke="url(#narrativeGrad)" stroke-width="4" filter="url(#glow)" />
