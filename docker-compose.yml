services:
  web:
    build:
      context: .
      dockerfile: src/WebApps/Shopping.Web/Dockerfile
    ports:
      - "5200:8080"
    depends_on:
      apigateway:
        condition: service_healthy

  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/WebShop.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Otel__Enabled: "true"
      Otel__Endpoint: http://jaeger:4317
    ports:
      - "5100:8080"
    depends_on:
      catalog-api:
        condition: service_healthy
      basket-api:
        condition: service_healthy
      ordering-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_started

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Catalog__Storage: Mongo
      Catalog__Mongo__ConnectionString: mongodb://mongodb:27017
      Otel__Enabled: "true"
      Otel__Endpoint: http://jaeger:4317
    ports:
      - "5101:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started

  basket-api:
    build:
      context: .
      dockerfile: src/Services/Basket.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Basket__Storage: Redis
      Basket__Redis__ConnectionString: redis:6379
      Otel__Enabled: "true"
      Otel__Endpoint: http://jaeger:4317
    ports:
      - "5102:8080"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Ordering__Storage: Postgres
      Ordering__Postgres__ConnectionString: Host=postgres;Port=5432;Username=webshop;Password=webshop;Database=ordering
      EventBus__Provider: RabbitMq
      EventBus__RabbitMq__Host: rabbitmq
      EventBus__RabbitMq__Username: guest
      EventBus__RabbitMq__Password: guest
      Catalog__Transport: Grpc
      Catalog__GrpcUrl: http://catalog-api:8081
      Otel__Enabled: "true"
      Otel__Endpoint: http://jaeger:4317
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
      POSTGRES_DB: ordering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d ordering"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/webshop/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
